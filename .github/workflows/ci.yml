name: CI

# Integration continue de MOONLIGHT.
#
# Portee : compilation et tests du moteur C++ (engine/core) sur Ubuntu 24.04
# x86-64 uniquement. Ce workflow ne valide NI Android, NI iOS, NI ARM64.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Annule les executions obsolètes d'une meme branche / PR ; ne touche jamais main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-13, gcc-14, clang-18]
        preset: [debug, release]
        include:
          - compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
          - compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
          - compiler: clang-18
            cc: clang-18
            cxx: clang++-18
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print toolchain versions
        run: |
          "$CXX" --version | head -n 1
          cmake --version | head -n 1
          ninja --version

      - name: Configure (preset ${{ matrix.preset }}, warnings as errors)
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test (CTest)
        run: ctest --preset ${{ matrix.preset }}

  sanitize:
    name: ${{ matrix.compiler }} / AddressSanitizer + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-13, clang-18]
        include:
          - compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
          - compiler: clang-18
            cc: clang-18
            cxx: clang++-18
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # Fait echouer le test des qu'UBSan detecte un probleme (sinon il se
      # contente d'afficher un message et le test peut passer quand meme).
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Contournement connu : avec les noyaux recents des runners, une
      # randomisation d'adresses trop elevee fait planter AddressSanitizer
      # au demarrage (surtout avec Clang). Reduire la valeur est inoffensif.
      - name: Lower ASLR entropy for AddressSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      # Les bibliotheques d'execution des sanitizers de Clang sont un paquet
      # separe ; on les installe explicitement au lieu de supposer qu'elles
      # sont presentes sur l'image du runner.
      - name: Install Clang sanitizer runtime
        if: matrix.compiler == 'clang-18'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-rt-18-dev

      - name: Print toolchain versions
        run: |
          "$CXX" --version | head -n 1
          cmake --version | head -n 1
          ninja --version

      - name: Configure (preset debug-sanitize, warnings as errors)
        run: cmake --preset debug-sanitize

      - name: Build
        run: cmake --build --preset debug-sanitize

      - name: Test (CTest)
        run: ctest --preset debug-sanitize
